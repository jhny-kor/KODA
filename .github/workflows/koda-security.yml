name: KODA Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 1"

permissions:
  contents: read

jobs:
  local-security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install KODA scanner
        run: python -m pip install platforms/shared/python
      - name: Run KODA local scan
        run: |
          python -m security_scanner scan --target . --format sarif --output koda-results.sarif --enable-osv --enable-vuln-intel
          python -m security_scanner scan --target . --format cyclonedx --output koda-sbom.cdx.json
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: koda-results.sarif
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: koda-sbom
          path: koda-sbom.cdx.json

  openssf-scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif
