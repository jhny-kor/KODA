name: ${COMPOSE_PROJECT_NAME:-koda-sbom}

services:
  gateway:
    image: ${NGINX_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME:-koda-sbom}-gateway
    depends_on:
      portal-web:
        condition: service_healthy
      portal-api:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_BIND:-127.0.0.1}:${PUBLIC_HTTP_PORT:-8088}:8080"
    volumes:
      - ./deploy/nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      GATEWAY_SERVER_NAME: ${GATEWAY_SERVER_NAME:-_}
      PORTAL_API_UPSTREAM: portal-api:${PORTAL_API_PORT:-8000}
      PORTAL_WEB_UPSTREAM: portal-web:${PORTAL_WEB_PORT:-8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      edge:
      app:
        ipv4_address: ${GATEWAY_APP_IP:-172.30.80.10}
    restart: unless-stopped

  portal-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
    image: ${PORTAL_WEB_IMAGE}:${PORTAL_IMAGE_TAG:-dev}
    container_name: ${COMPOSE_PROJECT_NAME:-koda-sbom}-portal-web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${PORTAL_WEB_PORT:-8080}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app
    restart: unless-stopped

  portal-api:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE}
        GRYPE_IMAGE: ${GRYPE_IMAGE}
    image: ${PORTAL_API_IMAGE}:${PORTAL_IMAGE_TAG:-dev}
    container_name: ${COMPOSE_PROJECT_NAME:-koda-sbom}-portal-api
    environment:
      TRACKER_DATA_UPDATE_VERIFY_KEY: /run/secrets/tracker-data-update-verify.pub
      TRACKER_OFFLINE_MODE: "true"
      TRACKER_EPSS_POLICY_MAX_AGE_DAYS: ${TRACKER_EPSS_POLICY_MAX_AGE_DAYS:-7}
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL}
      TRACKER_ARTIFACT_DIR: ${ARTIFACT_ROOT:-/var/lib/sbom-tracker/artifacts}
      TRACKER_MAX_UPLOAD_BYTES: ${UPLOAD_MAX_BYTES:-524288000}
      TRACKER_MAX_REQUEST_BODY_BYTES: ${TRACKER_MAX_REQUEST_BODY_BYTES:-65536}
      TRACKER_MAX_SBOM_COMPONENTS: ${TRACKER_MAX_SBOM_COMPONENTS:-50000}
      TRACKER_MAX_SERVICE_RUNS: ${TRACKER_MAX_SERVICE_RUNS:-10000}
      TRACKER_MAX_SERVICE_COMPONENTS: ${TRACKER_MAX_SERVICE_COMPONENTS:-2000000}
      TRACKER_MAX_QUEUED_JOBS: ${TRACKER_MAX_QUEUED_JOBS:-100}
      TRACKER_MAX_SERVICE_STORAGE_BYTES: ${TRACKER_MAX_SERVICE_STORAGE_BYTES:-10737418240}
      TRACKER_MAX_SERVICE_INGESTED_BYTES: ${TRACKER_MAX_SERVICE_INGESTED_BYTES:-21474836480}
      TRACKER_UPLOAD_RATE_LIMIT: ${TRACKER_UPLOAD_RATE_LIMIT:-60}
      TRACKER_UPLOAD_RATE_WINDOW_SECONDS: ${TRACKER_UPLOAD_RATE_WINDOW_SECONDS:-3600}
      TRACKER_DATA_UPDATE_SPOOL_DIR: /var/lib/sbom-tracker/data-updates
      TRACKER_BOOTSTRAP_ADMIN_USERNAME: ${TRACKER_BOOTSTRAP_ADMIN_USERNAME:-admin}
      TRACKER_BOOTSTRAP_ADMIN_PASSWORD: ${TRACKER_BOOTSTRAP_ADMIN_PASSWORD}
      TRACKER_SECURE_COOKIES: ${TRACKER_SECURE_COOKIES:-false}
      TRACKER_ENVIRONMENT: ${TRACKER_ENVIRONMENT:-development}
      TRACKER_PUBLIC_BIND: ${PUBLIC_HTTP_BIND:-127.0.0.1}
      TRACKER_PUBLIC_ORIGIN: ${TRACKER_PUBLIC_ORIGIN:-}
      TRACKER_TRUSTED_PROXY_CIDRS: ${TRACKER_TRUSTED_PROXY_CIDRS:-172.30.80.10/32}
      TRACKER_LDAP_ENCRYPTION_KEY: ${TRACKER_LDAP_ENCRYPTION_KEY:-}
      TRACKER_NOTIFICATION_WEBHOOK_ENABLED: ${TRACKER_NOTIFICATION_WEBHOOK_ENABLED:-false}
      TRACKER_NOTIFICATION_WEBHOOK_URL: ${TRACKER_NOTIFICATION_WEBHOOK_URL:-}
      TRACKER_NOTIFICATION_WEBHOOK_SECRET: ${TRACKER_NOTIFICATION_WEBHOOK_SECRET:-}
      TRACKER_NOTIFICATION_ALLOWED_HOSTS: ${TRACKER_NOTIFICATION_ALLOWED_HOSTS:-}
      TRACKER_PACKAGE_METADATA_ENABLED: "false"
      TRACKER_PACKAGE_METADATA_TTL_SECONDS: ${TRACKER_PACKAGE_METADATA_TTL_SECONDS:-86400}
      TRACKER_GRYPE_BINARY: ${TRACKER_GRYPE_BINARY:-grype}
      TRACKER_GRYPE_DB_DIR: ${TRACKER_GRYPE_DB_DIR:-/var/lib/sbom-tracker/vuln-data/current/grype-db}
      TRACKER_CYCLONEDX_CLI_BINARY: /usr/local/bin/cyclonedx
    volumes:
      - ${TRACKER_DATA_UPDATE_VERIFY_KEY_FILE:-./config/data-update-verify.pub}:/run/secrets/tracker-data-update-verify.pub:ro
      - tracker-artifacts:${ARTIFACT_ROOT:-/var/lib/sbom-tracker/artifacts}
      - data-updates:/var/lib/sbom-tracker/data-updates
      - vuln-data:${VULN_DATA_ROOT:-/var/lib/sbom-tracker/vuln-data}:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PORTAL_API_PORT:-8000}/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app
    restart: unless-stopped

  portal-worker:
    depends_on:
      portal-api:
        condition: service_healthy
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE}
        GRYPE_IMAGE: ${GRYPE_IMAGE}
    image: ${PORTAL_WORKER_IMAGE}:${PORTAL_IMAGE_TAG:-dev}
    container_name: ${COMPOSE_PROJECT_NAME:-koda-sbom}-portal-worker
    command: ["koda-tracker-worker"]
    environment:
      TRACKER_DATA_UPDATE_VERIFY_KEY: /run/secrets/tracker-data-update-verify.pub
      TRACKER_OFFLINE_MODE: "true"
      TRACKER_EPSS_POLICY_MAX_AGE_DAYS: ${TRACKER_EPSS_POLICY_MAX_AGE_DAYS:-7}
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL}
      TRACKER_ARTIFACT_DIR: ${ARTIFACT_ROOT:-/var/lib/sbom-tracker/artifacts}
      TRACKER_MAX_UPLOAD_BYTES: ${UPLOAD_MAX_BYTES:-524288000}
      TRACKER_NOTIFICATION_WEBHOOK_ENABLED: ${TRACKER_NOTIFICATION_WEBHOOK_ENABLED:-false}
      TRACKER_NOTIFICATION_WEBHOOK_URL: ${TRACKER_NOTIFICATION_WEBHOOK_URL:-}
      TRACKER_NOTIFICATION_WEBHOOK_SECRET: ${TRACKER_NOTIFICATION_WEBHOOK_SECRET:-}
      TRACKER_NOTIFICATION_ALLOWED_HOSTS: ${TRACKER_NOTIFICATION_ALLOWED_HOSTS:-}
      TRACKER_MAX_QUEUED_JOBS: ${TRACKER_MAX_QUEUED_JOBS:-100}
      TRACKER_PACKAGE_METADATA_ENABLED: "false"
      TRACKER_PACKAGE_METADATA_TTL_SECONDS: ${TRACKER_PACKAGE_METADATA_TTL_SECONDS:-86400}
      TRACKER_GRYPE_BINARY: ${TRACKER_GRYPE_BINARY:-grype}
      TRACKER_GRYPE_DB_DIR: ${TRACKER_GRYPE_DB_DIR:-/var/lib/sbom-tracker/vuln-data/current/grype-db}
      TRACKER_CYCLONEDX_CLI_BINARY: /usr/local/bin/cyclonedx
    volumes:
      - ${TRACKER_DATA_UPDATE_VERIFY_KEY_FILE:-./config/data-update-verify.pub}:/run/secrets/tracker-data-update-verify.pub:ro
      - tracker-artifacts:${ARTIFACT_ROOT:-/var/lib/sbom-tracker/artifacts}
      - vuln-data:${VULN_DATA_ROOT:-/var/lib/sbom-tracker/vuln-data}:ro
      - backups:/var/lib/sbom-tracker/backups
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from pathlib import Path; raise SystemExit('koda-tracker-worker' not in Path('/proc/1/cmdline').read_bytes().decode(errors='ignore'))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app
    restart: unless-stopped

  portal-metadata-collector:
    depends_on:
      portal-api:
        condition: service_healthy
    image: ${PORTAL_API_IMAGE}:${PORTAL_IMAGE_TAG:-dev}
    container_name: ${COMPOSE_PROJECT_NAME:-koda-sbom}-portal-metadata-collector
    command: ["python", "-m", "koda_tracker.package_metadata"]
    environment:
      TRACKER_OFFLINE_MODE: "true"
      TRACKER_EPSS_POLICY_MAX_AGE_DAYS: ${TRACKER_EPSS_POLICY_MAX_AGE_DAYS:-7}
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL}
      TRACKER_PACKAGE_METADATA_ENABLED: "false"
      TRACKER_PACKAGE_METADATA_TTL_SECONDS: ${TRACKER_PACKAGE_METADATA_TTL_SECONDS:-86400}
      TRACKER_PACKAGE_METADATA_REQUEST_TIMEOUT_SECONDS: ${TRACKER_PACKAGE_METADATA_REQUEST_TIMEOUT_SECONDS:-10}
      TRACKER_PACKAGE_METADATA_MIN_INTERVAL_SECONDS: ${TRACKER_PACKAGE_METADATA_MIN_INTERVAL_SECONDS:-1}
      TRACKER_PACKAGE_METADATA_MAX_ATTEMPTS: ${TRACKER_PACKAGE_METADATA_MAX_ATTEMPTS:-3}
      TRACKER_PACKAGE_METADATA_RETRY_SECONDS: ${TRACKER_PACKAGE_METADATA_RETRY_SECONDS:-60}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from pathlib import Path; raise SystemExit('koda_tracker.package_metadata' not in Path('/proc/1/cmdline').read_bytes().decode(errors='ignore'))\""]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - app
    restart: unless-stopped

  portal-data-updater:
    depends_on:
      portal-api:
        condition: service_healthy
    image: ${PORTAL_API_IMAGE}:${PORTAL_IMAGE_TAG:-dev}
    container_name: ${COMPOSE_PROJECT_NAME:-koda-sbom}-portal-data-updater
    command: ["python", "-m", "koda_tracker.worker", "--data-updates"]
    environment:
      TRACKER_DATA_UPDATE_VERIFY_KEY: /run/secrets/tracker-data-update-verify.pub
      TRACKER_OFFLINE_MODE: "true"
      TRACKER_EPSS_POLICY_MAX_AGE_DAYS: ${TRACKER_EPSS_POLICY_MAX_AGE_DAYS:-7}
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL}
      TRACKER_ARTIFACT_DIR: ${ARTIFACT_ROOT:-/var/lib/sbom-tracker/artifacts}
      TRACKER_GRYPE_BINARY: ${TRACKER_GRYPE_BINARY:-grype}
      TRACKER_DATA_UPDATE_KODA_GRYPE_BINARY: /usr/local/bin/koda-grype
      TRACKER_GRYPE_DB_DIR: ${TRACKER_GRYPE_DB_DIR:-/var/lib/sbom-tracker/vuln-data/current/grype-db}
      TRACKER_DATA_UPDATE_SPOOL_DIR: /var/lib/sbom-tracker/data-updates
    volumes:
      - tracker-artifacts:${ARTIFACT_ROOT:-/var/lib/sbom-tracker/artifacts}
      - ${TRACKER_DATA_UPDATE_VERIFY_KEY_FILE:-./config/data-update-verify.pub}:/run/secrets/tracker-data-update-verify.pub:ro
      - data-updates:/var/lib/sbom-tracker/data-updates
      - vuln-data:${VULN_DATA_ROOT:-/var/lib/sbom-tracker/vuln-data}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks:
      - app
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME:-koda-sbom}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF-8 --locale=C.UTF-8}
      TRACKER_DB_NAME: ${TRACKER_DB_NAME:-sbom_tracker}
      TRACKER_DB_USER: ${TRACKER_DB_USER:-sbom_tracker}
      TRACKER_DB_PASSWORD: ${TRACKER_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init/10-init-multi-db.sh:/docker-entrypoint-initdb.d/10-init-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "${POSTGRES_PORT:-5432}"
    networks:
      - app
    restart: unless-stopped


networks:
  edge:
    name: ${COMPOSE_PROJECT_NAME:-koda-sbom}-edge
  app:
    name: ${COMPOSE_PROJECT_NAME:-koda-sbom}-app
    internal: true
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.30.80.0/24}

volumes:
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME_NAME:-koda-sbom-postgres-data}
  tracker-artifacts:
    name: ${TRACKER_ARTIFACTS_VOLUME_NAME:-koda-sbom-tracker-artifacts}
  vuln-data:
    name: ${VULN_DATA_VOLUME_NAME:-koda-sbom-vuln-data}
  data-updates:
    name: ${DATA_UPDATES_VOLUME_NAME:-koda-sbom-data-updates}
  backups:
    name: ${BACKUP_VOLUME_NAME:-koda-sbom-backups}
