services:
  portal-api:
    environment:
      TRACKER_DATA_UPDATE_VERIFY_KEY: /run/secrets/tracker-data-update-verify.pub
      TRACKER_OFFLINE_MODE: "true"
      TRACKER_PACKAGE_METADATA_ENABLED: "false"
      TRACKER_KODA_PROVISIONING_TOKEN_FILE: /run/secrets/koda-tracker-provisioning
    volumes:
      - ${TRACKER_DATA_UPDATE_VERIFY_KEY_FILE:-./config/data-update-verify.pub}:/run/secrets/tracker-data-update-verify.pub:ro
      - ${KODA_TRACKER_PROVISIONING_TOKEN_FILE}:/run/secrets/koda-tracker-provisioning:ro

  portal-data-updater:
    environment:
      TRACKER_DATA_UPDATE_VERIFY_KEY: /run/secrets/tracker-data-update-verify.pub
    volumes:
      - ${TRACKER_DATA_UPDATE_VERIFY_KEY_FILE:-./config/data-update-verify.pub}:/run/secrets/tracker-data-update-verify.pub:ro

  gateway:
    volumes:
      - ./gateway/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      KODA_PORTAL_UPSTREAM: ${KODA_PORTAL_UPSTREAM:-koda-dashboard:8765}
      TRACKER_SESSION_UPSTREAM: ${TRACKER_SESSION_UPSTREAM:-portal-api:8000}
      KODA_GATEWAY_PROOF: ${KODA_GATEWAY_PROOF:?KODA_GATEWAY_PROOF is required}
    networks:
      - edge
      - app
      - koda_dashboard

  portal-worker:
    environment:
      TRACKER_OFFLINE_MODE: "true"
      TRACKER_PACKAGE_METADATA_ENABLED: "false"

networks:
  koda_dashboard:
    external: true
    name: ${KODA_DASHBOARD_NETWORK:-koda-dashboard}
